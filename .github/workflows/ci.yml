name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-26.04
    # Preserve the existing repository-only pull request policy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # packages/worker's build script (`wrangler deploy --dry-run`) needs a
      # config file to bundle against. The real wrangler.toml is gitignored
      # and never committed (it carries account/resource IDs), so materialize
      # one from the sanitized example — dry-run bundles and reports the
      # binding graph without calling the Cloudflare API, so no credentials
      # are needed here.
      - name: Materialize worker wrangler config for build validation
        run: cp packages/worker/wrangler.toml.example packages/worker/wrangler.toml
      - run: npm run check
