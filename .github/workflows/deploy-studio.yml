name: Deploy Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/studio/**'
      - 'packages/measurement/**'
      - '.github/workflows/deploy-studio.yml'

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build studio
        run: npm run build --workspace @flarelytics/studio

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: packages/studio
